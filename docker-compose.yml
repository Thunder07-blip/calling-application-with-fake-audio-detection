services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: safecall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --node-ip=${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"

  coturn:
    image: coturn/coturn
    command: >
      -n
      --log-file=stdout
      --realm=livekit
      --no-cli
      --no-tls
      --listening-port=5349
    ports:
      - "5349:5349"
      - "5349:5349/udp"

  backend-api:
    build: ./backend_api
    ports:
      - "8000:8000"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/safecall}
    depends_on:
      - livekit
      - db

  ml-agent:
    build: ./ml_agent_python
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - ROOM_NAME=${ROOM_NAME:-testroom}
    depends_on:
      - livekit

volumes:
  postgres_data: